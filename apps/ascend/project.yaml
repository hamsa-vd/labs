name: ascend
description: Invite-only job-application tracker derived from Gmail events
status: scaffold
language: typescript
runtime: node
kind: web-application
clients:
  - responsive-web
  - installable-pwa
design_system:
  package: "@labs/design"
  adapter: arey
  # @labs/design pre-harvests arey's runtime-injected component CSS at its own
  # build time (packages/typescript/design/scripts/build-arey-css.ts) and ships
  # one static @labs/design/arey.css — no per-app build step needed.
deployment:
  target: mac-mini
  process_manager: launchd
  ingress: cloudflare-access-and-tunnel
  access_zones:
    bypass:
      - /welcome
      - /privacy
      - /status
      - /api/v1/invite-requests
      # Theme bootstrap script (@labs/design), needed on the bypassed public
      # pages above too — must not sit behind Access or anonymous visitors
      # get no dark/light switching.
      - /api/labs-theme
    allow: everything-else
commands:
  dev: pnpm dev
  check: pnpm check
  test: pnpm test
  build: pnpm build
  eval: pnpm eval
