<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0}body{background:var(--bg-base);padding:20px;font:var(--type-body);color:var(--text-body)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.col{display:grid;gap:14px}
.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-tertiary)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.AreyDesignSystem_1909f9;

const { Toast, Tooltip, Spinner, ProgressBar, EmptyState, Button, IconButton, Card } = NS;
function Demo() {
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,alignItems:'start'}}>
      <div className="col">
        <Toast tone="success" title="Deployment promoted to production" onDismiss={()=>{}} />
        <Toast tone="danger" title="Build failed at step 3" description="Check the install log." action={<Button variant="link">View logs</Button>} onDismiss={()=>{}} />
        <div className="row" style={{gap:20}}>
          <Tooltip label="Rotate key"><IconButton icon="arrows-clockwise" label="Rotate key" variant="bordered" /></Tooltip>
          <Tooltip mono label="2026-07-31 14:02 UTC"><span style={{font:'var(--type-code)',color:'var(--text-secondary)',borderBottom:'1px dashed var(--border-strong)'}}>3 m ago</span></Tooltip>
          <Spinner size={18} />
        </div>
        <div className="col" style={{gap:8}}>
          <ProgressBar value={68} />
          <ProgressBar value={94} tone="warning" />
          <ProgressBar thin indeterminate />
        </div>
      </div>
      <div className="col">
        <Card variant="flat" padded={false}>
          <EmptyState compact icon="rocket-launch" title="No deployments yet" description="Push to the production branch, or deploy from the CLI." action={<Button variant="primary" iconLeft="plus">Create deployment</Button>} />
        </Card>
        <div style={{position:'relative',height:150,borderRadius:'var(--radius-sheet)',overflow:'hidden',background:'var(--bg-canvas)',display:'grid',placeItems:'center'}}>
          <div style={{position:'absolute',inset:0,background:'var(--surface-scrim)'}} />
          <div style={{position:'relative',width:'88%',background:'var(--surface-raised)',border:'1px solid var(--border-default)',borderRadius:'var(--radius-sheet)',boxShadow:'var(--shadow-xl)',padding:20}}>
            <div style={{font:'var(--type-title-3)',color:'var(--text-primary)'}}>Delete project</div>
            <div style={{font:'var(--type-caption)',color:'var(--text-secondary)',marginTop:6}}>This removes all deployments and cannot be undone.</div>
            <div className="row" style={{justifyContent:'flex-end',marginTop:16}}>
              <Button size="sm">Cancel</Button><Button size="sm" variant="danger">Delete</Button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
