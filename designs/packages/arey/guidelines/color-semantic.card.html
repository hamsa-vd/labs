<!-- @dsCard group="Colors" viewport="700x190" name="Status colours" subtitle="Wash + text pairs only — never large fields" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-base);padding:24px;font:var(--type-body);color:var(--text-body)}.mono{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div style="display:flex;gap:12px;flex-wrap:wrap"><div style="display:flex;align-items:center;gap:8px;background:var(--success-wash);color:var(--success-text);border-radius:var(--radius-full);padding:6px 14px;font:var(--type-label)"><span style="width:6px;height:6px;border-radius:50%;background:var(--success-solid)"></span>Ready</div><div style="display:flex;align-items:center;gap:8px;background:var(--danger-wash);color:var(--danger-text);border-radius:var(--radius-full);padding:6px 14px;font:var(--type-label)"><span style="width:6px;height:6px;border-radius:50%;background:var(--danger-solid)"></span>Failed</div><div style="display:flex;align-items:center;gap:8px;background:var(--warning-wash);color:var(--warning-text);border-radius:var(--radius-full);padding:6px 14px;font:var(--type-label)"><span style="width:6px;height:6px;border-radius:50%;background:var(--warning-solid)"></span>Building</div><div style="display:flex;align-items:center;gap:8px;background:var(--bg-inset);color:var(--text-secondary);border-radius:var(--radius-full);padding:6px 14px;font:var(--type-label)"><span style="width:6px;height:6px;border-radius:50%;background:var(--grey-400)"></span>Queued</div></div>
<div style="display:flex;gap:8px;margin-top:20px"><div style="flex:1;height:44px;border-radius:var(--radius-md);background:var(--success-solid)"></div><div style="flex:1;height:44px;border-radius:var(--radius-md);background:var(--danger-solid)"></div><div style="flex:1;height:44px;border-radius:var(--radius-md);background:var(--warning-solid)"></div></div>
<div style="display:flex;gap:8px;margin-top:6px"><div class="mono" style="flex:1;text-transform:none">--success-solid</div><div class="mono" style="flex:1;text-transform:none">--danger-solid</div><div class="mono" style="flex:1;text-transform:none">--warning-solid</div></div></body></html>
