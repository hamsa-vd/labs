<!-- @dsCard group="Colors" viewport="700x180" name="Text hierarchy" subtitle="primary → body → secondary → tertiary → disabled" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-base);padding:24px;font:var(--type-body);color:var(--text-body)}.mono{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div style="display:grid;gap:9px;font:var(--type-body-lg)">
<div style="display:flex;align-items:baseline;gap:12px"><span style="color:var(--text-primary)">Primary — headings and key values</span><span class="mono" style="text-transform:none">--text-primary</span></div><div style="display:flex;align-items:baseline;gap:12px"><span style="color:var(--text-body)">Body — running copy</span><span class="mono" style="text-transform:none">--text-body</span></div><div style="display:flex;align-items:baseline;gap:12px"><span style="color:var(--text-secondary)">Secondary — descriptions</span><span class="mono" style="text-transform:none">--text-secondary</span></div><div style="display:flex;align-items:baseline;gap:12px"><span style="color:var(--text-tertiary)">Tertiary — eyebrows and meta</span><span class="mono" style="text-transform:none">--text-tertiary</span></div><div style="display:flex;align-items:baseline;gap:12px"><span style="color:var(--text-disabled)">Disabled</span><span class="mono" style="text-transform:none">--text-disabled</span></div>
</div></body></html>
