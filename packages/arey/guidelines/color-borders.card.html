<!-- @dsCard group="Colors" viewport="700x160" name="Borders" subtitle="Alpha-based hairlines, so they work on any surface" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-base);padding:24px;font:var(--type-body);color:var(--text-body)}.mono{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div style="display:flex;gap:14px"><div style="flex:1;height:76px;border-radius:var(--radius-card);border:1px solid var(--border-subtle);display:grid;place-content:center;gap:4px;text-align:center"><div class="mono" style="text-transform:none">--border-subtle</div><div style="font:var(--type-caption);color:var(--text-secondary)">4–6 %</div></div><div style="flex:1;height:76px;border-radius:var(--radius-card);border:1px solid var(--border-default);display:grid;place-content:center;gap:4px;text-align:center"><div class="mono" style="text-transform:none">--border-default</div><div style="font:var(--type-caption);color:var(--text-secondary)">12 %</div></div><div style="flex:1;height:76px;border-radius:var(--radius-card);border:1px solid var(--border-strong);display:grid;place-content:center;gap:4px;text-align:center"><div class="mono" style="text-transform:none">--border-strong</div><div style="font:var(--type-caption);color:var(--text-secondary)">20 %</div></div><div style="flex:1;height:76px;border-radius:var(--radius-card);border:1px solid var(--border-focus);display:grid;place-content:center;gap:4px;text-align:center"><div class="mono" style="text-transform:none">--border-focus</div><div style="font:var(--type-caption);color:var(--text-secondary)">accent</div></div></div></body></html>
