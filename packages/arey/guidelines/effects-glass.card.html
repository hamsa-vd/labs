<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-base);padding:24px;font:var(--type-body);color:var(--text-body)}.mono{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div style="position:relative;height:152px;border-radius:var(--radius-card);overflow:hidden;background:var(--bg-canvas)">
<div style="position:absolute;inset:0"><div style="position:absolute;left:40px;top:-30px;width:180px;height:180px;border-radius:50%;background:var(--blue-400)"></div><div style="position:absolute;left:210px;top:60px;width:150px;height:150px;border-radius:50%;background:var(--grey-800)"></div><div style="position:absolute;left:420px;top:10px;width:200px;height:120px;border-radius:var(--radius-lg);background:var(--blue-200)"></div></div>
<div style="position:absolute;left:0;right:0;top:44px;height:64px;background:var(--surface-glass);backdrop-filter:var(--backdrop-glass);-webkit-backdrop-filter:var(--backdrop-glass);border-top:1px solid var(--border-glass);border-bottom:1px solid var(--border-glass);display:flex;align-items:center;padding:0 24px;gap:14px">
<span style="font:var(--type-title-3);color:var(--text-primary)">Floating layer</span><span class="mono" style="text-transform:none">--surface-glass</span></div>
</div></body></html>
