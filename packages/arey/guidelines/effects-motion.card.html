<!-- @dsCard group="Effects" viewport="700x210" name="Easing &amp; duration" subtitle="Everything eases out; interactive gets a light spring" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-base);padding:24px;font:var(--type-body);color:var(--text-body)}.mono{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-tertiary)}@keyframes run{0%{left:0}50%{left:calc(100% - 10px)}100%{left:0}}</style></head><body><div style="display:grid;gap:12px">
<div style="display:flex;align-items:center;gap:14px"><div class="mono" style="width:120px;text-transform:none">--ease-out</div><div style="flex:1;height:2px;background:var(--border-default);position:relative"><div style="position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent-solid);animation:run 2.4s cubic-bezier(.22,1,.36,1) infinite"></div></div><div style="font:var(--type-caption);color:var(--text-secondary);width:88px">default</div></div><div style="display:flex;align-items:center;gap:14px"><div class="mono" style="width:120px;text-transform:none">--ease-spring</div><div style="flex:1;height:2px;background:var(--border-default);position:relative"><div style="position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent-solid);animation:run 2.4s cubic-bezier(.34,1.4,.64,1) infinite"></div></div><div style="font:var(--type-caption);color:var(--text-secondary);width:88px">press / hover</div></div><div style="display:flex;align-items:center;gap:14px"><div class="mono" style="width:120px;text-transform:none">--ease-standard</div><div style="flex:1;height:2px;background:var(--border-default);position:relative"><div style="position:absolute;left:0;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent-solid);animation:run 2.4s cubic-bezier(.4,0,.2,1) infinite"></div></div><div style="font:var(--type-caption);color:var(--text-secondary);width:88px">layout</div></div>
<div style="display:flex;gap:18px;margin-top:6px"><div class="mono" style="text-transform:none">instant <span style="color:var(--text-body)">80ms</span></div><div class="mono" style="text-transform:none">fast <span style="color:var(--text-body)">140ms</span></div><div class="mono" style="text-transform:none">normal <span style="color:var(--text-body)">220ms</span></div><div class="mono" style="text-transform:none">slow <span style="color:var(--text-body)">320ms</span></div><div class="mono" style="text-transform:none">slower <span style="color:var(--text-body)">480ms</span></div></div>
</div></body></html>
