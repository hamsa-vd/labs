<!-- @dsCard group="Colors" viewport="700x180" name="Surfaces — light" subtitle="Cards sit lighter than the canvas" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-base);padding:24px;font:var(--type-body);color:var(--text-body)}.mono{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div data-theme="light" style="background:var(--bg-canvas);border-radius:var(--radius-lg);padding:20px;display:flex;gap:14px">
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-md);padding:16px"><div class="mono" style="text-transform:none">--surface-card</div><div style="font:var(--type-title-3);color:var(--text-primary);margin-top:6px">#ffffff</div></div>
<div style="flex:1;background:var(--bg-inset);border-radius:var(--radius-card);padding:16px"><div class="mono" style="text-transform:none">--bg-inset</div><div style="font:var(--type-title-3);color:var(--text-primary);margin-top:6px">#f5f5f5</div></div>
<div style="flex:1;background:var(--bg-canvas);border:1px dashed var(--border-default);border-radius:var(--radius-card);padding:16px"><div class="mono" style="text-transform:none">--bg-canvas</div><div style="font:var(--type-title-3);color:var(--text-primary);margin-top:6px">#f5f5f5</div></div>
</div></body></html>
