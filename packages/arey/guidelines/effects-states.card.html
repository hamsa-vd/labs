<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--bg-base);padding:24px;font:var(--type-body);color:var(--text-body)}.mono{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-tertiary)}</style></head><body><div style="display:flex;gap:14px;align-items:center">
<div style="display:grid;gap:10px;justify-items:center"><div style="height:36px;padding:0 18px;display:grid;place-items:center;border-radius:var(--radius-control);background:var(--accent-solid);color:var(--accent-text-on);font:var(--type-label);">Deploy</div><div class="mono" style="text-transform:none">Rest</div></div><div style="display:grid;gap:10px;justify-items:center"><div style="height:36px;padding:0 18px;display:grid;place-items:center;border-radius:var(--radius-control);background:var(--accent-solid-hover);color:var(--accent-text-on);font:var(--type-label);">Deploy</div><div class="mono" style="text-transform:none">Hover</div></div><div style="display:grid;gap:10px;justify-items:center"><div style="height:36px;padding:0 18px;display:grid;place-items:center;border-radius:var(--radius-control);background:var(--accent-solid-active);color:var(--accent-text-on);font:var(--type-label);transform:scale(.97)">Deploy</div><div class="mono" style="text-transform:none">Press</div></div><div style="display:grid;gap:10px;justify-items:center"><div style="height:36px;padding:0 18px;display:grid;place-items:center;border-radius:var(--radius-control);background:var(--accent-solid);color:var(--accent-text-on);font:var(--type-label);box-shadow:var(--ring-focus)">Deploy</div><div class="mono" style="text-transform:none">Focus</div></div><div style="display:grid;gap:10px;justify-items:center"><div style="height:36px;padding:0 18px;display:grid;place-items:center;border-radius:var(--radius-control);background:var(--accent-solid);color:var(--accent-text-on);font:var(--type-label);opacity:.4">Deploy</div><div class="mono" style="text-transform:none">Disabled</div></div>
</div>
<div style="display:flex;gap:14px;align-items:center;margin-top:18px">
<div style="display:grid;gap:10px;justify-items:center"><div style="height:36px;padding:0 18px;display:grid;place-items:center;border-radius:var(--radius-control);background:transparent;color:var(--text-body);font:var(--type-label);">Overview</div><div class="mono" style="text-transform:none">Quiet · Rest</div></div><div style="display:grid;gap:10px;justify-items:center"><div style="height:36px;padding:0 18px;display:grid;place-items:center;border-radius:var(--radius-control);background:var(--bg-hover);color:var(--text-body);font:var(--type-label);">Overview</div><div class="mono" style="text-transform:none">Quiet · Hover</div></div><div style="display:grid;gap:10px;justify-items:center"><div style="height:36px;padding:0 18px;display:grid;place-items:center;border-radius:var(--radius-control);background:var(--bg-selected);color:var(--text-body);font:var(--type-label);color:var(--text-accent)">Overview</div><div class="mono" style="text-transform:none">Quiet · Selected</div></div>
</div></body></html>
