<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0}body{background:var(--bg-base);padding:20px;font:var(--type-body);color:var(--text-body)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.col{display:grid;gap:14px}
.lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-tertiary)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head>
<body><div id="root"></div>
<script type="text/babel">
const NS = window.AreyDesignSystem_1909f9;

const { Table, TableHead, TableCell, TableRow, Badge } = NS;
const rows = [
  { project: 'arey-web', env: 'Production', status: 'Ready', duration: '38 s', updated: '3 m ago' },
  { project: 'arey-docs', env: 'Preview', status: 'Building', duration: '12 s', updated: '1 m ago' },
  { project: 'arey-console', env: 'Production', status: 'Failed', duration: '1.2 s', updated: '14 m ago' },
];
const tone = { Ready: 'success', Building: 'accent', Failed: 'danger' };
function Demo() {
  return (
    <Table>
      <thead><tr>
        <TableHead>Project</TableHead>
        <TableHead>Environment</TableHead>
        <TableHead>Status</TableHead>
        <TableHead align="right">Duration</TableHead>
        <TableHead align="right">Updated</TableHead>
      </tr></thead>
      <tbody>
        {rows.map((r) => (
          <TableRow key={r.project} interactive>
            <TableCell mono>{r.project}</TableCell>
            <TableCell>{r.env}</TableCell>
            <TableCell><Badge tone={tone[r.status]}>{r.status}</Badge></TableCell>
            <TableCell mono align="right">{r.duration}</TableCell>
            <TableCell mono align="right">{r.updated}</TableCell>
          </TableRow>
        ))}
      </tbody>
    </Table>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
